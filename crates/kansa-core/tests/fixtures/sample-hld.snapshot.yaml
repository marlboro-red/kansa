  start: 403
  end: 493
  section: 2. Validation
- id: s-17c17a7a
  ord: 8
  block: li
  text: The email address shall match RFC 5322 and shall have a resolvable MX record.
  h: 17c17a7afb7b3a7a
  start: 495
  end: 574
  section: 2. Validation
  depth: 1
- id: s-a3bc73e5
  ord: 9
  block: li
  text: The ABN, when supplied, shall pass the ATO checksum. Invalid ABNs shall be rejected with error ABN_INVALID.
  h: a3bc73e529c39baa
  start: 575
  end: 686
  section: 2. Validation
  depth: 1
- id: s-d841e69d
  ord: 10
  block: li
  text: 'Required fields are: applicant name, date of birth, email, and at least one contact number.'
